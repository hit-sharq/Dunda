      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "201":
          description: Created tier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "409":
          description: That code is already taken
        "404":
          description: Not found
  /admin/plans/{planId}:
    patch:
      operationId: updatePlan
      tags: [admin]
      summary: Edit a tier
      description: >
        Existing subscriptions keep their own terms, so a price change does not
        silently re-price clubs already on that tier.
      parameters:
        - in: path
          name: planId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "200":
          description: Updated tier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "404":
          description: Not found
  /admin/organizations/{organizationId}/subscription:
