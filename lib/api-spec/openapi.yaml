openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Dunda club operating system API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Operational overview and activity
  - name: branches
    description: Branch and floor operations
  - name: products
    description: Product catalog
  - name: tabs
    description: Customer tabs and checkout
  - name: orders
    description: Active orders
  - name: reservations
    description: Table reservations
  - name: inventory
    description: Inventory alerts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Current operating summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent operational activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /branches:
    get:
      operationId: getBranches
      tags: [branches]
      summary: List branches
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
  /branches/{branchId}/floor:
    get:
      operationId: getBranchFloor
      tags: [branches]
      summary: Get branch floor and table status
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Floor sections and tables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Floor"
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products for the POS
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /tabs:
    get:
      operationId: getTabs
      tags: [tabs]
      summary: List customer tabs
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [OPEN, CLOSED]
            default: OPEN
      responses:
        "200":
          description: Customer tabs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tab"
    post:
      operationId: createTab
      tags: [tabs]
      summary: Open a customer tab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TabInput"
      responses:
        "201":
          description: Opened tab
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tab"
  /tabs/{tabId}:
    get:
      operationId: getTab
      tags: [tabs]
      summary: Get tab details
      parameters:
        - $ref: "#/components/parameters/TabId"
      responses:
        "200":
          description: Tab details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tab"
        "404":
          description: Tab not found
    post:
      operationId: addTabItem
      tags: [tabs]
      summary: Add an item to an open tab
      parameters:
        - $ref: "#/components/parameters/TabId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TabItemInput"
      responses:
        "200":
          description: Updated tab
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tab"
  /tabs/{tabId}/checkout:
    post:
      operationId: checkoutTab
      tags: [tabs]
      summary: Pay and close a tab
      parameters:
        - $ref: "#/components/parameters/TabId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Completed checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: List active orders
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [NEW, PREPARING, READY, SERVED, COMPLETED]
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /reservations:
    get:
      operationId: getReservations
      tags: [reservations]
      summary: List upcoming reservations
      responses:
        "200":
          description: Reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
    post:
      operationId: createReservation
      tags: [reservations]
      summary: Create a reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationInput"
      responses:
        "201":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
  /inventory/alerts:
    get:
      operationId: getInventoryAlerts
      tags: [inventory]
      summary: List low stock items
      responses:
        "200":
          description: Low stock items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryAlert"
components:
  parameters:
    BranchId:
      in: path
      name: branchId
      required: true
      schema:
        type: string
    TabId:
      in: path
      name: tabId
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Branch:
      type: object
      required: [id, name, city, status, activeTables, totalTables, revenueToday]
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string }
        status: { type: string, enum: [LIVE, CLOSED] }
        activeTables: { type: integer }
        totalTables: { type: integer }
        revenueToday: { type: number }
    Table:
      type: object
      required: [id, name, section, seats, status, total, tabId]
      properties:
        id: { type: string }
        name: { type: string }
        section: { type: string }
        seats: { type: integer }
        status: { type: string, enum: [AVAILABLE, OCCUPIED, RESERVED, PAYMENT_PENDING, CLEANING] }
        total: { type: number }
        tabId: { type: ["string", "null"] }
        customer: { type: ["string", "null"] }
    FloorSection:
      type: object
      required: [id, name, tables]
      properties:
        id: { type: string }
        name: { type: string }
        tables:
          type: array
          items: { $ref: "#/components/schemas/Table" }
    Floor:
      type: object
      required: [branchId, sections]
      properties:
        branchId: { type: string }
        sections:
          type: array
          items: { $ref: "#/components/schemas/FloorSection" }
    Category:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }
    Product:
      type: object
      required: [id, name, categoryId, category, price, unit, stock, available, accent]
      properties:
        id: { type: string }
        name: { type: string }
        categoryId: { type: string }
        category: { type: string }
        price: { type: number }
        unit: { type: string }
        stock: { type: number }
        available: { type: boolean }
        accent: { type: string }
    TabItem:
      type: object
      required: [id, productId, name, quantity, unitPrice, total, category]
      properties:
        id: { type: string }
        productId: { type: string }
        name: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        total: { type: number }
        category: { type: string }
    Tab:
      type: object
      required: [id, number, customer, table, status, items, subtotal, serviceCharge, tax, discount, total, openedAt]
      properties:
        id: { type: string }
        number: { type: string }
        customer: { type: string }
        table: { type: string }
        status: { type: string, enum: [OPEN, CLOSED] }
        items:
          type: array
          items: { $ref: "#/components/schemas/TabItem" }
        subtotal: { type: number }
        serviceCharge: { type: number }
        tax: { type: number }
        discount: { type: number }
        total: { type: number }
        openedAt: { type: string, format: date-time }
    TabInput:
      type: object
      required: [customer, table]
      properties:
        customer: { type: string, minLength: 1 }
        table: { type: string, minLength: 1 }
    TabItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
    CheckoutInput:
      type: object
      required: [method, amount]
      properties:
        method: { type: string, enum: [CASH, MPESA, CARD, BANK_TRANSFER, OTHER] }
        amount: { type: number, minimum: 0 }
        reference: { type: ["string", "null"] }
    CheckoutResult:
      type: object
      required: [tab, receiptNumber, paymentMethod, paidAt]
      properties:
        tab: { $ref: "#/components/schemas/Tab" }
        receiptNumber: { type: string }
        paymentMethod: { type: string }
        paidAt: { type: string, format: date-time }
    Order:
      type: object
      required: [id, number, table, status, items, createdAt]
      properties:
        id: { type: string }
        number: { type: string }
        table: { type: string }
        status: { type: string, enum: [NEW, PREPARING, READY, SERVED, COMPLETED] }
        items: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    Reservation:
      type: object
      required: [id, customer, phone, date, time, table, guests, status]
      properties:
        id: { type: string }
        customer: { type: string }
        phone: { type: string }
        date: { type: string, format: date }
        time: { type: string }
        table: { type: string }
        guests: { type: integer }
        status: { type: string, enum: [PENDING, CONFIRMED, ACTIVE, COMPLETED, CANCELLED, NO_SHOW] }
    ReservationInput:
      type: object
      required: [customer, phone, date, time, table, guests]
      properties:
        customer: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        date: { type: string, format: date }
        time: { type: string, minLength: 1 }
        table: { type: string, minLength: 1 }
        guests: { type: integer, minimum: 1 }
        notes: { type: ["string", "null"] }
    InventoryAlert:
      type: object
      required: [id, name, category, stock, minimum, unit, severity]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        stock: { type: number }
        minimum: { type: number }
        unit: { type: string }
        severity: { type: string, enum: [LOW, OUT] }
    ActivityItem:
      type: object
      required: [id, type, title, detail, amount, timestamp]
      properties:
        id: { type: string }
        type: { type: string, enum: [PAYMENT, ORDER, RESERVATION, INVENTORY, SHIFT] }
        title: { type: string }
        detail: { type: string }
        amount: { type: ["number", "null"] }
        timestamp: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [date, revenue, orders, averageOrderValue, activeTables, activeTabs, poolRevenue, foodRevenue, drinkRevenue, outstandingPayments, revenueSeries, categoryBreakdown, paymentBreakdown, topProducts]
      properties:
        date: { type: string, format: date }
        revenue: { type: number }
        orders: { type: integer }
        averageOrderValue: { type: number }
        activeTables: { type: integer }
        activeTabs: { type: integer }
        poolRevenue: { type: number }
        foodRevenue: { type: number }
        drinkRevenue: { type: number }
        outstandingPayments: { type: number }
        revenueSeries:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"
        categoryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"
        paymentBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"
        topProducts:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"
    MetricPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }

