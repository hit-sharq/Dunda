    patch:
      operationId: updateTicket
      tags: [orders]
      summary: Advance a station ticket through the service workflow
      description: >
        Stock is deducted when the ticket is served, not when the order closes.
        The table is released once no ticket remains open.
      parameters:
        - in: path
          name: ticketId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
