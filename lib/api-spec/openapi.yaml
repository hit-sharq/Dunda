      responses:
        "200":
          description: Updated settings
        "404":
          description: Not found
  /admin/organizations/{organizationId}/owner:
    post:
      operationId: assignOrganizationOwner
      tags: [admin]
      summary: Assign or reassign the owner of a client
      description: >
        An operator provisions a client, so they sit above that tenant rather
        than inside it. This is how they gain access to a club they are
        onboarding, and how a running club is handed to the person who runs it.
        The setup token is the tenant path and is not needed here.
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignOwnerInput" }
      responses:
        "200":
          description: Ownership assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignOwnerResult" }
        "404":
          description: Not found, or that venue does not exist
  /admin/plans:
    get:
      operationId: getPlans
      tags: [admin]
      summary: The plan catalogue
      description: >
        Prices live here rather than on each subscription, so changing what a club
        pays is one edit. Limits are the pricing: a club past its branch or user
        limit has to move up.
      responses:
        "200":
          description: Every tier
