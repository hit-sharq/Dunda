  /tickets/by-tab/{tabId}:
    get:
      operationId: getTicketsByTab
      tags: [orders]
      summary: Station tickets raised from one tab
      description: >
        What the floor asks for: everything a table has rung in, and which
        stations still owe them something.
      parameters:
        - in: path
          name: tabId
          required: true
          schema: { type: string }
