components:
  parameters:
    BranchId:
      in: path
      name: branchId
      required: true
      schema:
        type: string
    TabId:
      in: path
      name: tabId
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Branch:
      type: object
      required: [id, name, city, status, activeTables, totalTables, revenueToday]
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string }
        status: { type: string, enum: [LIVE, CLOSED] }
        activeTables: { type: integer }
        totalTables: { type: integer }
        revenueToday: { type: number }
    Table:
      type: object
      required: [id, name, section, seats, status, total, tabId]
      properties:
        id: { type: string }
        name: { type: string }
        section: { type: string }
        seats: { type: integer }
        status: { type: string, enum: [AVAILABLE, OCCUPIED, RESERVED, PAYMENT_PENDING, CLEANING] }
        total: { type: number }
        tabId: { type: ["string", "null"] }
        customer: { type: ["string", "null"] }
        x: { type: integer }
        y: { type: integer }
        width: { type: integer }
        height: { type: integer }
    FloorSection:
      type: object
      required: [id, name, tables]
      properties:
        id: { type: string }
        name: { type: string }
        tables:
          type: array
          items: { $ref: "#/components/schemas/Table" }
    Floor:
      type: object
      required: [branchId, sections]
      properties:
        branchId: { type: string }
        sections:
          type: array
          items: { $ref: "#/components/schemas/FloorSection" }
    Category:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }
    Product:
      type: object
      required:
        [
          id,
          name,
          categoryId,
          category,
          price,
          unit,
          baseUnit,
          stock,
          available,
          active,
          trackInventory,
          accent,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        categoryId: { type: string }
        category: { type: string }
        price: { type: number }
        unit: { type: string }
        baseUnit: { type: string }
        stock: { type: number }
        available: { type: boolean }
        active: { type: boolean }
        trackInventory: { type: boolean }
        accent: { type: string }
        sku: { type: ["string", "null"] }
        barcode: { type: ["string", "null"] }
        cost: { type: integer }
        tax: { type: integer }
        description: { type: ["string", "null"] }
    ProductUnit:
      type: object
      required: [id, productId, name, abbreviation, conversionFactor, sellingPrice, wholeUnitsOnly]
      properties:
        id: { type: string }
        productId: { type: string }
        name: { type: string }
        abbreviation: { type: string }
        conversionFactor: { type: number }
        sellingPrice: { type: number }
        cost: { type: ["number", "null"] }
        wholeUnitsOnly: { type: boolean }
        isBaseUnit: { type: boolean }
        sortOrder: { type: integer }
    TabItem:
      type: object
      required: [id, productId, name, quantity, unitPrice, total, category]
      properties:
        id: { type: string }
        productId: { type: string }
        name: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        total: { type: number }
        category: { type: string }
        unitId: { type: ["string", "null"] }
        unitName: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    Tab:
      type: object
      required: [id, number, customer, table, status, items, subtotal, serviceCharge, tax, discount, total, openedAt]
      properties:
        id: { type: string }
        number: { type: string }
        customer: { type: string }
        table: { type: string }
        status: { type: string, enum: [OPEN, CLOSED] }
        items:
          type: array
          items: { $ref: "#/components/schemas/TabItem" }
        subtotal: { type: number }
        serviceCharge: { type: number }
        tax: { type: number }
        discount: { type: number }
        total: { type: number }
        openedAt: { type: string, format: date-time }
    TabInput:
      type: object
      required: [customer, table]
      properties:
        customer: { type: string, minLength: 1 }
