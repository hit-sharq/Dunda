openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Dunda club operating system API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Operational overview and activity
  - name: branches
    description: Branch and floor operations
  - name: products
    description: Product catalog
  - name: categories
    description: Product categories
  - name: units
    description: Product unit configuration
  - name: tabs
    description: Customer tabs and checkout
  - name: orders
    description: Active orders
  - name: staff
    description: Staff management
  - name: shifts
    description: Staff shift tracking
  - name: customers
    description: Customer profiles
  - name: reservations
    description: Table reservations
  - name: events
    description: Event management
  - name: inventory
    description: Inventory, stock, suppliers
  - name: reports
    description: Sales and operational reports
  - name: audit
    description: Audit log access
  - name: floors
    description: Floor designer, sections and tables
  - name: payments
    description: Payments and refunds
  - name: stock
    description: Stock transfers and counts
  - name: notifications
    description: Notification center
  - name: search
    description: Global search
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Current operating summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent operational activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /branches:
    get:
      operationId: getBranches
      tags: [branches]
      summary: List branches
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
  /branches/{branchId}/floor:
    get:
      operationId: getBranchFloor
      tags: [branches]
      summary: Get branch floor and table status
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Floor sections and tables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Floor"
  /branches/{branchId}/tables:
    get:
      operationId: getBranchTables
      tags: [branches]
      summary: List all tables for a branch
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Table"
  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: List product categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products for the POS
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{productId}/units:
    get:
      operationId: getProductUnits
      tags: [units]
      summary: Get selling units for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductUnit"
    post:
      operationId: createProductUnit
      tags: [units]
      summary: Add a selling unit
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUnitInput" }
      responses:
        "201":
          description: Created unit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductUnit" }
  /tabs:
    get:
      operationId: getTabs
      tags: [tabs]
      summary: List customer tabs
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [OPEN, CLOSED]
            default: OPEN
      responses:
        "200":
          description: Customer tabs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tab"
    post:
      operationId: createTab
      tags: [tabs]
      summary: Open a customer tab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TabInput"
      responses:
        "201":
          description: Opened tab
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tab"
  /tabs/{tabId}:
    get:
      operationId: getTab
      tags: [tabs]
      summary: Get tab details
      parameters:
        - $ref: "#/components/parameters/TabId"
      responses:
        "200":
          description: Tab details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tab"
        "404":
          description: Tab not found
    post:
      operationId: addTabItem
      tags: [tabs]
      summary: Add an item to an open tab
      parameters:
        - $ref: "#/components/parameters/TabId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TabItemInput"
      responses:
        "200":
          description: Updated tab
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tab"
  /tabs/{tabId}/checkout:
    post:
      operationId: checkoutTab
      tags: [tabs]
      summary: Pay and close a tab
      parameters:
        - $ref: "#/components/parameters/TabId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Completed checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: List active orders
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, PENDING, ACCEPTED, PREPARING, READY, SERVED, COMPLETED, CANCELLED]
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /staff:
    get:
      operationId: getStaff
      tags: [staff]
      summary: List staff members
      responses:
        "200":
          description: Staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: createStaff
      tags: [staff]
      summary: Create a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffInput"
      responses:
        "201":
          description: Created staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
  /staff/{staffId}:
    get:
      operationId: getStaffMember
      tags: [staff]
      summary: Get staff member details
      parameters:
        - in: path
          name: staffId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
    patch:
      operationId: updateStaff
      tags: [staff]
      summary: Update a staff member
      description: >
        Promoting somebody to the owner role obeys the same rule as creating
        one: only an owner may do it, and only while nobody holds it.
      parameters:
        - in: path
          name: staffId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStaffInput" }
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "403":
          description: Not permitted to grant that role
  /staff/{staffId}/transfer-ownership:
    post:
      operationId: transferOwnership
      tags: [staff]
      summary: Hand ownership to another staff member
      description: >
        There is exactly one owner. This demotes the current owner to
        Administrator rather than leaving two people with identical authority.
      parameters:
        - in: path
          name: staffId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ownership transferred
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [staff]
      summary: Whether an organization still has nobody signed in as owner
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
  /setup/claim:
    post:
      operationId: claimOwnership
      tags: [staff]
      summary: Claim ownership with a single-use setup token
      description: >
        Signing in alone never grants anything. A token, issued out of band and
        stored only as a digest, binds the signed-in account to the owner role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimOwnershipInput" }
      responses:
        "200":
          description: Ownership claimed
  /realtime/ticket:
    post:
      operationId: createRealtimeTicket
      tags: [staff]
      summary: Exchange the session token for a short-lived realtime ticket
      description: >
        A WebSocket handshake cannot carry an Authorization header, so the
        session token used to travel in the URL. This keeps it in a header and
        puts a 30-second single-use code in the URL instead.
      responses:
        "200":
          description: A realtime ticket
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresInSeconds]
                properties:
                  ticket: { type: string }
                  expiresInSeconds: { type: integer }
  /staff/shifts:
    get:
      operationId: getShifts
      tags: [shifts]
      summary: List staff shifts
      responses:
        "200":
          description: Staff shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffShift"
    post:
      operationId: createShift
      tags: [shifts]
      summary: Create a staff shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShiftInput"
      responses:
        "201":
          description: Created shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffShift"
  /customers:
    get:
      operationId: getCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /customers/{customerId}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer details
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /events:
    get:
      operationId: getEvents
      tags: [events]
      summary: List events
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /events/{eventId}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event details
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /reservations:
    get:
      operationId: getReservations
      tags: [reservations]
      summary: List upcoming reservations
      responses:
        "200":
          description: Reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
    post:
      operationId: createReservation
      tags: [reservations]
      summary: Create a reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationInput"
      responses:
        "201":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
  /inventory:
    get:
      operationId: getInventory
      tags: [inventory]
      summary: List inventory items
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: adjustInventory
      tags: [inventory]
      summary: Adjust inventory quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustInventoryInput"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
  /inventory/alerts:
    get:
      operationId: getInventoryAlerts
      tags: [inventory]
      summary: List low stock items
      responses:
        "200":
          description: Low stock items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryAlert"
  /suppliers:
    get:
      operationId: getSuppliers
      tags: [inventory]
      summary: List suppliers
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [inventory]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupplierInput"
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
  /reports/sales:
    get:
      operationId: getSalesReport
      tags: [reports]
      summary: Get sales report
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Sales report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"
  /reports/products:
    get:
      operationId: getProductReport
      tags: [reports]
      summary: Get product sales report
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Product report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductReportItem"
  /audit-logs:
    get:
      operationId: getAuditLogs
      tags: [audit]
      summary: List audit log entries
      parameters:
        - in: query
          name: entity
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
  /products/barcodes/{barcode}:
    get:
      operationId: getProductByBarcode
      tags: [products]
      summary: Resolve a scanned barcode to a product and selling unit
      parameters:
        - in: path
          name: barcode
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product matched by barcode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BarcodeLookup" }
        "404":
          description: Product not found
  /products/{productId}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Deactivate or delete a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
  /products/{productId}/units/{unitId}:
    patch:
      operationId: updateProductUnit
      tags: [units]
      summary: Update a selling unit or its price
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
        - in: path
          name: unitId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUnitInput" }
      responses:
        "200":
          description: Updated unit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductUnit" }
    delete:
      operationId: deleteProductUnit
      tags: [units]
      summary: Remove a selling unit
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
        - in: path
          name: unitId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
  /products/{productId}/barcodes:
    post:
      operationId: createProductBarcode
      tags: [products]
      summary: Register a barcode against a selling unit
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductBarcodeInput" }
      responses:
        "201":
          description: Created barcode
  /products/{productId}/barcodes/{barcodeId}:
    delete:
      operationId: deleteProductBarcode
      tags: [products]
      summary: Remove a barcode
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
        - in: path
          name: barcodeId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
  /floors:
    get:
      operationId: getFloors
      tags: [floors]
      summary: List floors and sections for a branch
      parameters:
        - in: query
          name: branchId
          schema: { type: string }
      responses:
        "200":
          description: Floors with sections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FloorLayout" }
    post:
      operationId: createFloor
      tags: [floors]
      summary: Create a floor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FloorInput" }
      responses:
        "201":
          description: Created floor
  /floors/{floorId}:
    patch:
      operationId: updateFloor
      tags: [floors]
      summary: Rename or reorder a floor
      parameters:
        - in: path
          name: floorId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FloorInput" }
      responses:
        "200":
          description: Updated floor
    delete:
      operationId: deleteFloor
      tags: [floors]
      summary: Delete an empty floor
      parameters:
        - in: path
          name: floorId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
  /floors/{floorId}/sections:
    post:
      operationId: createFloorSection
      tags: [floors]
      summary: Create a section
      parameters:
        - in: path
          name: floorId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FloorSectionInput" }
      responses:
        "201":
          description: Created section
  /floors/sections/{sectionId}:
    patch:
      operationId: updateFloorSection
      tags: [floors]
      summary: Rename a section
      parameters:
        - in: path
          name: sectionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FloorSectionInput" }
      responses:
        "200":
          description: Updated section
    delete:
      operationId: deleteFloorSection
      tags: [floors]
      summary: Delete a section and its tables
      parameters:
        - in: path
          name: sectionId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
  /floors/tables:
    get:
      operationId: getFloorTables
      tags: [floors]
      summary: List tables for a branch
      parameters:
        - in: query
          name: branchId
          schema: { type: string }
      responses:
        "200":
          description: Tables
          content:
