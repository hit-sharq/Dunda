kind = "web"
previewPath = "/"
title = "Dunda Club Operating System"
description = "A real club operations platform for nightlife venues, covering live floor operations, POS tabs, inventory visibility, staff workflows, reservations, and management reporting."
version = "1.0.0"
id = "artifacts/dunda"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23896

[services.development]
run = "pnpm --filter @workspace/dunda run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dunda", "run", "build" ]
serve = "static"
publicDir = "artifacts/dunda/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23896"
BASE_PATH = "/"
